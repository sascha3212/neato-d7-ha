# Neato D7 serial bridge
#
# Turns the ESP32 inside the robot into a plain serial-to-Wi-Fi pipe. The
# "Neato Mapper" Home Assistant add-on connects to TCP port 6638 and does all
# the talking to the robot, so this firmware has no Neato logic of its own.
#
# Uses the same wiring as fang: robot TX -> ESP RX, robot RX -> ESP TX, GND.
# No cable needed when fang is already on the ESP: install this over Wi-Fi.
# See "Install over Wi-Fi" in the README. For the first upload, keep the OTA
# password the same as fang's and set use_address below to the ESP's current IP.

substitutions:
  name: neato-bridge
  friendly_name: Neato Bridge
  # Pins used by fang: ESP32 TX 17 / RX 16, ESP32-C3 TX 7 / RX 6
  uart_tx: "17"
  uart_rx: "16"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  # For an ESP32-C3 board use: variant: ESP32C3 (and the C3 pins above)
  variant: ESP32
  framework:
    type: esp-idf

logger:
  # Keep the UART free for the robot; logs go over Wi-Fi only.
  baud_rate: 0

api:
  encryption:
    key: !secret neato_bridge_api

ota:
  - platform: esphome
    password: !secret neato_bridge_ota
  # Also allow uploading a .bin from the ESP's own web page
  - platform: web_server

# If a new build can't boot or join Wi-Fi a few times in a row, the ESP comes
# up in a minimal mode that only accepts OTA, so it can always be fixed remotely
safe_mode:

web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # First upload over fang: uncomment and put the ESP's current IP here, since
  # the new name (neato-bridge.local) doesn't exist on the network yet
  # use_address: 192.168.1.50
  ap:
    ssid: "${name}-fallback"

captive_portal:

external_components:
  - source: github://oxan/esphome-stream-server

uart:
  id: uart_bus
  baud_rate: 115200
  tx_pin: ${uart_tx}
  rx_pin: ${uart_rx}
  # A lidar scan is ~5 KB of text; leave room so nothing is dropped
  rx_buffer_size: 8192

stream_server:
  id: neato_stream
  uart_id: uart_bus
  port: 6638
  buffer_size: 8192

binary_sensor:
  - platform: stream_server
    stream_server: neato_stream
    connected:
      name: "Mapper connected"

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
